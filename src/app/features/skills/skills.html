<section id="skills" class="skills-section py-20 px-6 md:px-10 lg:px-16">
  <div class="container mx-auto max-w-5xl">
    <div class="mb-10">
      <div class="flex items-end gap-3">
        <span class="consola-mono text-[#00D3F3] text-2xl">02.</span>
        <h2 class="text-3xl md:text-4xl font-bold text-white">Skillset</h2>
      </div>
      <div class="mt-4 h-px bg-[#1D293D] opacity-80"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="stack-card" *ngFor="let col of columns" data-aos="zoom-in">
        <div class="flex items-center justify-between">
          <h3 class="text-white font-semibold text-lg">{{ col.title }}</h3>
          <img [src]="col.icon" alt="" class="w-6 h-6 opacity-90" />
        </div>

        <div class="mt-4 flex flex-wrap gap-2">
          <span class="pill" *ngFor="let item of col.items">{{ item }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
