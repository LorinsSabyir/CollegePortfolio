<section id="certificate" class="certificate-section py-20 px-6 md:px-10 lg:px-16">
  <div class="container mx-auto max-w-5xl">
    <div class="mb-10">
      <div class="flex items-end gap-3">
        <span class="consola-mono text-[#00D3F3] text-2xl">04.</span>
        <h2 class="text-3xl md:text-4xl font-bold text-white">Certifications</h2>
      </div>
      <div class="mt-4 h-px bg-[#1D293D] opacity-80"></div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-7xl mx-auto">
      @for (project of certificate; track $index) {
        <app-project-card [data]="project" [isLinkPresent]="false" [isBodyPresent]="false"></app-project-card>
      }
    </div>
    
  </div>
</section>
