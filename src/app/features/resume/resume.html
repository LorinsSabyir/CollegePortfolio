<div class="min-h-screen">
  <app-navbar></app-navbar>

  <main class="mx-auto max-w-4xl px-6 pt-28 pb-16 md:px-10">
    <h1 class="text-3xl md:text-4xl font-bold text-white mb-3">Resume</h1>
    <p class="text-neutral-300 mb-8">
      Add your resume PDF to <code class="text-[#00D3F3]">public/resume.pdf</code> and this page will link to it.
    </p>

    <div class="flex flex-wrap gap-3">
      <a class="btn-primary consola-mono" href="/resume.pdf" target="_blank" rel="noreferrer">
        $ &gt; Open Resume
        <img src="icons/new-tab.png" alt="" class="w-5" />
      </a>
      <a class="btn-secondary consola-mono" routerLink="/" fragment="contacts">$ &gt; Contact</a>
    </div>

    <div class="mt-10 rounded-xl border border-[#1D293D] bg-[rgba(15,23,43,0.50)] p-6">
      <h2 class="text-xl font-semibold text-white mb-2">Tip</h2>
      <p class="text-neutral-300">
        If you want this to be a fully designed resume page (not a PDF link), tell me and I’ll build it to match
        your portfolio style.
      </p>
    </div>
