<div class="stack-card" data-aos="zoom-in">
  <div class="flex items-center justify-between">
    <h3 class="text-white font-semibold text-lg">{{ data?.title }}</h3>
    <img [src]="data?.icon" alt="" class="w-6 h-6 opacity-90" />
  </div>

  <div class="mt-4 flex flex-wrap gap-2">
    @for (skill of data?.items; track $index) {
      <app-chips [text]="skill" color="primary"></app-chips>
    }
  </div>
</div>
