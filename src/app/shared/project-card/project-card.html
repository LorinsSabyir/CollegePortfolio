<article class="project-card" data-aos="fade-up">
  <div class="flex items-start justify-between gap-4">
    <h3 class="text-white text-xl font-semibold">{{ data?.title }}</h3>
    <a [href]="data.link" target="_blank" rel="noopener noreferrer">
      <img src="icons/new-tab.png" alt="" class="w-5 h-5 opacity-80" />
    </a>
    
  </div>

  <p class="mt-3 text-[#90A1B9] leading-7">{{ data?.description }}</p>

  <div class="mt-5 flex flex-wrap gap-2">
    @for (tag of data?.tags; track $index) {
      <span class="tag">{{ tag }}</span>
    }
    
  </div>
</article>
