<article
  class="project-card flex flex-col h-full bg-[#0B1221] border border-[#1D293D] rounded-xl overflow-hidden hover:border-[#00D3F3]/30 transition-all duration-300 shadow-lg"
  data-aos="fade-up"
>
  <div
    class="relative group w-full aspect-square overflow-hidden bg-[#0D172A] rounded-xl flex items-center justify-center border-b border-[#1D293D]"
  >
    <img
      [src]="data.image"
      [alt]="data.title"
      class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
    />
  </div>

  <div class="flex flex-col flex-1 pt-5">
    <div class="flex items-start justify-between gap-2 mb-3">
      <div>
        <h3 class="text-white text-lg font-semibold overflow-hidden text-clip">
          {{ data?.title }}
        </h3>
      </div>
      <a [href]="data.link" target="_blank" rel="noopener noreferrer">
        <img
          src="icons/new-tab.png"
          alt=""
          class="w-5 h-5 min-w-5 min-h-5 shrink-0 opacity-70 object-contain"
        />
      </a>
    </div>

    <p class="text-[#90A1B9] text-sm leading-6 line-clamp-3 mb-4 overflow-hidden">
      {{ data?.description }}
    </p>

    <div class="mt-auto flex flex-wrap gap-2">
      @for (tag of data?.tags; track $index) {
      <app-chips [text]="tag" color="secondary"></app-chips>
      }
    </div>
  </div>
</article>
